name: Create Release Branch
description: Creates a Flutter release branch from the current pubspec.yaml version

inputs:
  git-user-email:
    description: 'Git User Email'
    required: false
    default: 'github@bigblueswimschool.com'
  git-user-name:
    description: 'Git User Name'
    required: false
    default: 'Big Blue CICD'

runs:
  using: "composite"
  steps:
    - name: Configure Git
      run: |
        git config --global user.email "${{ inputs.git-user-email }}"
        git config --global user.name "${{ inputs.git-user-name }}"
      shell: bash
    - name: Create Release Branch
      run: |
        git pull
        level="${{ inputs.level }}"
        CURRENT_VERSION=$(grep -m1 "^version:" pubspec.yaml | sed -E 's/^version: ([0-9]+)\.([0-9]+)\..*/\1.\2/')
        git checkout -b release/${CURRENT_VERSION}
        git push --set-upstream origin release/${CURRENT_VERSION}
        git checkout ${{ github.ref_name }}
      shell: bash
