name: Run Tests

inputs:
  nodeVersion:
    description: 'Node Version'
    required: false
    default: '16.x'
  npmToken:
    description: 'NPM Token'
    required: false
  githubToken:
    description: 'GitHub Token'
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ inputs.nodeVersion }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.nodeVersion }}
        cache: 'yarn'
    - if: ${{ inputs.inputs.npmToken != '' }}
      run: npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN -g
      env:
        NPM_TOKEN: ${{ inputs.npmToken }}
      shell: bash
    - if: ${{ inputs.inputs.githubToken != '' }}
      run: npm config set //npm.pkg.github.com/:_authToken=$GITHUB_TOKEN -g
      env:
        GITHUB_TOKEN: ${{ inputs.githubToken }}
      shell: bash
    - run: |
        yarn
        yarn test
      shell: bash
