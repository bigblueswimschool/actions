name: Create Release Branch

on:
  workflow_dispatch:

jobs:
  version:
    name: Create Release Branch
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      name: Checkout Repo
      with:
        token: ${{ secrets.PAT }}
    - uses: bigblueswimschool/actions/version@v1
      name: Commit and Tag Current Version
    - uses: actions/checkout@v6
    - uses: bigblueswimschool/actions/create-release-branch@v1
      name: Create Release Branch
    - uses: bigblueswimschool/actions/version@v1
      name: Increment Minor Version on develop Branch
      with:
        level: 'preminor'
        alias-tags: true