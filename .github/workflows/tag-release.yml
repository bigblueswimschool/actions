name: Tag Release

on:
  push:
    branches: 
      - release/*
    paths-ignore:
      - 'package.json'

jobs:
  version:
    name: Increment Patch Version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      name: Checkout Repo
      with:
        token: ${{ secrets.PAT }}
    - uses: bigblueswimschool/actions/version@v1
      name: Increment Patch Version